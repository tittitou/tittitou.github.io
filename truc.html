<script>

//////////////////////////////////////////////////////////////////////

// BASIC DATA
//
//////////////////////////////////////////////////////////////////////

const N = 10;

const partitionSVG = document.getElementById("partition");
const treeSVG = document.getElementById("tree");

const radius = 180;

const center = {
    x:250,
    y:250
};

let selected=[];

//////////////////////////////////////////////////////////////////////
//
// NONCROSSING PARTITION
//
//////////////////////////////////////////////////////////////////////

class NonCrossingPartition{

    constructor(n){

        this.n=n;

        this.blocks=[];

        for(let i=0;i<n;i++)
            this.blocks.push([i]);

    }

    clone(){

        let p=new NonCrossingPartition(this.n);

        p.blocks=this.blocks.map(b=>b.slice());

        return p;

    }

    normalize(){

        for(let b of this.blocks)
            b.sort((a,b)=>a-b);

        this.blocks.sort((a,b)=>a[0]-b[0]);

    }

    blockContaining(v){

        for(let b of this.blocks)
            if(b.includes(v))
                return b;

        return null;

    }

    split(v){

        let nb=[];

        for(let b of this.blocks){

            if(b.includes(v)){

                for(let x of b)
                    nb.push([x]);

            }

            else{

                nb.push(b);

            }

        }

        this.blocks=nb;

        this.normalize();

    }

    merge(a,b){

        let A=this.blockContaining(a);
        let B=this.blockContaining(b);

        if(A===B)
            return;

        let candidate=[];

        for(let x of A)
            candidate.push(x);

        for(let x of B)
            candidate.push(x);

        candidate.sort((x,y)=>x-y);

        let tmp=[];

        for(let blk of this.blocks){

            if(blk!==A && blk!==B)
                tmp.push(blk);

        }

        tmp.push(candidate);

        let test=new NonCrossingPartition(this.n);
        test.blocks=tmp;
        test.normalize();

        if(test.isNonCrossing()){

            this.blocks=test.blocks;

        }

        else{

            alert("This merge would create crossings.");

        }

    }
